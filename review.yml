actions:
  apisYmlUpdated: true
  openapiHarvested: false
  reason: |
    No first-party public API surface, no downloadable spec, and no documented
    FDX/1033 data-access API exist for Frost Bank. The honest result is an
    identity-only company record with an aggregator-mediated (Plaid/Finicity)
    data-access posture and empty apis[]. Nothing was fabricated and no spec was
    harvested.
