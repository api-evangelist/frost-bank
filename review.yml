    - url: https://www.frostbank.com/developers
      status: 404
      note: No developers page.
    - url: https://www.frostbank.com/api
      status: 404
      note: No API page.
    - url: https://www.frostbank.com/financial-technology
      status: 200
      note: Consumer banking-technology marketing page; mentions "Account aggregation with Plaid", not a developer API.
    - url: https://www.frostbank.com/
      status: 200
      note: Corporate website (live).
