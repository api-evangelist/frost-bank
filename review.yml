      - Finicity
    authModel: aggregator-mediated (no Frost-published API auth scheme)
    charterType: Texas state-chartered commercial bank (Texas Department of Banking / Federal Reserve)
    parent: Cullen/Frost Bankers, Inc. (NYSE CFR)
  transports:
    - protocol: REST
